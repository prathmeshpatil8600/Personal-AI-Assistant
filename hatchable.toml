[auth]
enabled = true
providers = ["email"]

[ai]
required = true

[db.tables.user_preferences]
read = "own"
write = "own"

[db.tables.conversations]
read = "own"
write = "own"

[db.tables.conversation_messages]
read = "own"
write = "own"

[db.tables.tasks]
read = "own"
write = "own"

[db.tables.notes]
read = "own"
write = "own"

[db.tables.reminders]
read = "own"
write = "own"

[db.tables.documents]
read = "own"
write = "own"

[db.tables.document_chunks]
read = "own"
write = "own"

[db.tables.calendar_events]
read = "own"
write = "own"

[db.tables.memories]
read = "own"
write = "own"

[db.tables.assistant_notifications]
read = "own"
write = "own"

[db.tables.productivity_daily]
read = "own"
write = "own"

[[cron]]
path = "/api/jobs/hourly-reminders"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/daily-stats"
schedule = "10 0 * * *"