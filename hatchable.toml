[auth]
enabled = true
providers = ["email"]

[mcp]
enabled = true

[ai]
required = false
providers = ["google", "anthropic"]
description = "Gemini 3.8 Flash primary with Groq fallback. Claude remains optional for later."

[[secret]]
name = "GROQ_API_KEY"
provider = "custom"
required = false
description = "Optional Groq API key used as the second AI provider when Gemini is unavailable."

[[secret]]
name = "GOOGLE_API_KEY"
provider = "custom"
required = false
expose = true
description = "Google API key used by Gemini generation, PDF extraction, and embedding runtimes."

[[secret]]
name = "GOOGLE_OAUTH_CLIENT_ID"
provider = "custom"
required = false
expose = true
description = "Google OAuth 2.0 Web application client ID for Gmail, Calendar, and Drive connections."

[[secret]]
name = "GOOGLE_OAUTH_CLIENT_SECRET"
provider = "custom"
required = false
expose = true
description = "Google OAuth 2.0 Web application client secret. Stored server-side only."

[[secret]]
name = "GOOGLE_OAUTH_ENCRYPTION_KEY"
provider = "custom"
required = false
expose = true
description = "Long random secret used to encrypt Google refresh tokens at rest."

[[secret]]
name = "GITHUB_CLIENT_ID"
provider = "custom"
required = false
expose = true
description = "GitHub App client ID used for the SecondBrain GitHub connection."

[[secret]]
name = "GITHUB_CLIENT_SECRET"
provider = "custom"
required = false
expose = true
description = "GitHub App client secret used server-side for OAuth token exchange."

[[secret]]
name = "GITHUB_OAUTH_ENCRYPTION_KEY"
provider = "custom"
required = false
expose = true
description = "Long random server-only key used to encrypt GitHub tokens at rest."

[[secret]]
name = "RAZORPAY_KEY_ID"
provider = "custom"
required = false
expose = true
description = "Razorpay API key ID used server-side for subscription billing."

[[secret]]
name = "RAZORPAY_KEY_SECRET"
provider = "custom"
required = false
expose = true
description = "Razorpay API key secret. Server-side only."

[[secret]]
name = "RAZORPAY_PLAN_PLUS_MONTHLY"
provider = "custom"
required = false
expose = true
description = "Razorpay Plan ID for the Plus monthly subscription."

[[secret]]
name = "RAZORPAY_PLAN_PLUS_ANNUAL"
provider = "custom"
required = false
expose = true
description = "Razorpay Plan ID for the Plus annual subscription."

[[secret]]
name = "RAZORPAY_PLAN_PRO_MONTHLY"
provider = "custom"
required = false
expose = true
description = "Razorpay Plan ID for the Pro monthly subscription."

[[secret]]
name = "RAZORPAY_PLAN_PRO_ANNUAL"
provider = "custom"
required = false
expose = true
description = "Razorpay Plan ID for the Pro annual subscription."

