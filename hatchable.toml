[auth]
enabled = true
providers = ["email"]

[ai]
required = false
providers = ["google", "anthropic"]
description = "Gemini 3.8 Flash primary with Groq fallback. Claude remains optional for later."

[[secret]]
name = "GROQ_API_KEY"
provider = "custom"
required = false
description = "Optional Groq API key used as the second AI provider when Gemini is unavailable."

[[secret]]
name = "GOOGLE_API_KEY"
provider = "custom"
required = false
expose = true
description = "Google API key used by Gemini generation, PDF extraction, and embedding runtimes."

[db.tables.user_preferences]
read = "own"
write = "own"

[db.tables.conversations]
read = "own"
write = "own"

[db.tables.conversation_messages]
read = "own"
write = "own"

[db.tables.tasks]
read = "own"
write = "own"

[db.tables.notes]
read = "own"
write = "own"

[db.tables.reminders]
read = "own"
write = "own"

[db.tables.documents]
read = "member"
write = "member"

[db.tables.document_chunks]
read = "member"
write = "member"

[db.tables.document_vectors]
read = "member"
write = "member"

[db.tables.calendar_events]
read = "own"
write = "own"

[db.tables.memories]
read = "own"
write = "own"

[db.tables.assistant_notifications]
read = "own"
write = "own"

[db.tables.productivity_daily]
read = "own"
write = "own"

[db.tables.goals]
read = "own"
write = "own"

[db.tables.habits]
read = "own"
write = "own"

[db.tables.habit_completions]
read = "member"
write = "member"

[db.tables.ai_runs]
read = "member"
write = "member"

[db.tables.tool_approvals]
read = "member"
write = "member"

[db.tables.tool_runs]
read = "member"
write = "member"

[[cron]]
path = "/api/jobs/hourly-reminders"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/daily-stats"
schedule = "10 0 * * *"

[[cron]]
path = "/api/jobs/daily-briefing"
schedule = "30 6 * * *"

[[cron]]
path = "/api/jobs/weekly-review"
schedule = "45 6 * * 1"