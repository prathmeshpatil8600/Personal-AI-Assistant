[auth]
enabled = true
providers = ["email"]

[ai]
required = false
providers = ["google", "anthropic"]
description = "Gemini-first AI with Groq fallback. Claude remains optional for later."

[[secret]]
name = "GROQ_API_KEY"
provider = "custom"
required = false
description = "Optional Groq API key used as the second AI provider when Gemini is unavailable."

[[secret]]
name = "OPENAI_API_KEY"
provider = "custom"
required = false
description = "OpenAI API key used by Hatchable embeddings for document RAG."

[db.tables.user_preferences]
read = "own"
write = "own"

[db.tables.conversations]
read = "own"
write = "own"

[db.tables.conversation_messages]
read = "own"
write = "own"

[db.tables.tasks]
read = "own"
write = "own"

[db.tables.notes]
read = "own"
write = "own"

[db.tables.reminders]
read = "own"
write = "own"

[db.tables.documents]
read = "own"
write = "own"

[db.tables.document_chunks]
read = "own"
write = "own"

[db.tables.calendar_events]
read = "own"
write = "own"

[db.tables.memories]
read = "own"
write = "own"

[db.tables.assistant_notifications]
read = "own"
write = "own"

[db.tables.productivity_daily]
read = "own"
write = "own"

[db.tables.goals]
read = "own"
write = "own"

[db.tables.habits]
read = "own"
write = "own"

[[cron]]
path = "/api/jobs/hourly-reminders"
schedule = "0 * * * *"

[[cron]]
path = "/api/jobs/daily-stats"
schedule = "10 0 * * *"

[[cron]]
path = "/api/jobs/daily-briefing"
schedule = "30 6 * * *"

[[cron]]
path = "/api/jobs/weekly-review"
schedule = "45 6 * * 1"