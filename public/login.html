<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · secondbrain</title><link rel="stylesheet" href="/theme.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="card" style="width:min(420px,100%)"><div class="brand" style="padding:0 0 20px">second<span style="color:var(--accent)">brain</span></div><h1 style="font-size:28px">Welcome back</h1><p class="label" style="margin-bottom:24px">Sign in with a one-time email code. No password required.</p><div id="form"><input id="email" type="email" autocomplete="username" placeholder="you@example.com" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px"><button id="send" class="primary" style="width:100%;margin-top:10px">Send code</button></div><div id="codeBox" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px"><button id="verify" class="primary" style="width:100%;margin-top:10px">Sign in</button></div><p id="msg" class="label" style="margin-top:14px"></p></section></main><script>
const A=window.hatchable?.auth,next=new URLSearchParams(location.search).get('next')||'/';let email='';
send.onclick=async()=>{email=document.getElementById('email').value.trim();if(!email)return msg.textContent='Enter your email.';send.disabled=true;try{await A.startLogin({email});form.hidden=true;codeBox.hidden=false;msg.textContent='Code sent. Check your email.';code.focus()}catch(e){msg.textContent=e.message||'Could not send code.'}send.disabled=false};
verify.onclick=async()=>{verify.disabled=true;try{const r=await A.verifyCode({email,code:code.value.trim()});if(r?.user)location.replace(next.startsWith('/')&&!next.startsWith('//')?next:'/');else msg.textContent='Invalid code.'}catch(e){msg.textContent=e.message||'Invalid code.'}verify.disabled=false};
</script></body></html>
